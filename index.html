function buildChairMesh() {
  const chairMat = new THREE.MeshStandardMaterial({ color: 0x232323, roughness: 0.7 });
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.1, metalness: 0.95 });
  const wheelDarkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
  const wheelRimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2, metalness: 0.8 });

  const chairGroup = new THREE.Group();

  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.06, 0.45), chairMat);
  seat.position.y = 0.45;
  seat.castShadow = true;
  chairGroup.add(seat);

  const back = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.06), chairMat);
  back.position.set(0, 0.7, 0.2);
  back.castShadow = true;
  chairGroup.add(back);

  const centerPole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.25), chromeMat);
  centerPole.position.y = 0.295;
  centerPole.castShadow = true;
  chairGroup.add(centerPole);

  const baseCenter = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.06), chromeMat);
  baseCenter.position.y = 0.17;
  chairGroup.add(baseCenter);

  const numLegs = 5;
  const legRadius = 0.24;

  for (let i = 0; i < numLegs; i++) {
    const angle = (i * Math.PI * 2) / numLegs;

    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(0, 0.17, 0),
      new THREE.Vector3(Math.cos(angle) * (legRadius * 0.5), 0.22, Math.sin(angle) * (legRadius * 0.5)),
      new THREE.Vector3(Math.cos(angle) * legRadius, 0.08, Math.sin(angle) * legRadius)
    );

    const legGeo = new THREE.TubeGeometry(curve, 12, 0.014, 8, false);
    const legMesh = new THREE.Mesh(legGeo, chromeMat);
    legMesh.castShadow = true;
    chairGroup.add(legMesh);

    const wheelGroup = new THREE.Group();
    wheelGroup.position.set(Math.cos(angle) * legRadius, 0.04, Math.sin(angle) * legRadius);

    const wheelCap = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.03), chromeMat);
    wheelCap.position.y = 0.025;
    wheelGroup.add(wheelCap);

    const wheelBody = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.02), wheelDarkMat);
    wheelBody.rotation.z = Math.PI / 2;
    wheelGroup.add(wheelBody);

    const wheelRim = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.022), wheelRimMat);
    wheelRim.rotation.z = Math.PI / 2;
    wheelGroup.add(wheelRim);

    wheelGroup.rotation.y = angle;
    chairGroup.add(wheelGroup);
  }

  return chairGroup;
}

function buildKeyboardMesh() {
  const kbdGroup = new THREE.Group();
  
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f2124, roughness: 0.35, metalness: 0.4 });
  const keyMat = new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.5, metalness: 0.1 });
  const spaceMat = new THREE.MeshStandardMaterial({ color: 0x1a1c1e, roughness: 0.5, metalness: 0.1 });

  const bodyW = 0.44, bodyD = 0.15;
  const baseGeo = new THREE.BoxGeometry(bodyW, 0.012, bodyD);
  const base = new THREE.Mesh(baseGeo, bodyMat);
  base.position.y = 0.006;
  base.castShadow = true;
  base.receiveShadow = true;
  kbdGroup.add(base);

  const topBezel = new THREE.Mesh(new THREE.BoxGeometry(bodyW, 0.005, 0.02), bodyMat);
  topBezel.position.set(0, 0.0135, -bodyD / 2 + 0.01);
  kbdGroup.add(topBezel);

  const keyAreaGroup = new THREE.Group();
  
  const rows = 5;
  const cols = 14;
  const keyW = 0.02, keyD = 0.018, keyH = 0.005;
  const gapX = 0.003, gapZ = 0.003;

  const startX = -((cols * (keyW + gapX)) / 2) + keyW / 2 - 0.025;
  const startZ = -((rows * (keyD + gapZ)) / 2) + keyD / 2 + 0.005;

  const keyGeo = new THREE.BoxGeometry(keyW, keyH, keyD);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (r === 4 && c >= 3 && c <= 8) continue;

      const key = new THREE.Mesh(keyGeo, keyMat);
      const posX = startX + c * (keyW + gapX);
      const posZ = startZ + r * (keyD + gapZ);
      key.position.set(posX, keyH / 2, posZ);
      key.castShadow = true;
      keyAreaGroup.add(key);
    }
  }

  const spaceW = (keyW + gapX) * 6 - gapX;
  const spaceBar = new THREE.Mesh(new THREE.BoxGeometry(spaceW, keyH, keyD), spaceMat);
  const spaceX = startX + 5.5 * (keyW + gapX);
  const spaceZ = startZ + 4 * (keyD + gapZ);
  spaceBar.position.set(spaceX, keyH / 2, spaceZ);
  spaceBar.castShadow = true;
  keyAreaGroup.add(spaceBar);

  const numCols = 3, numRows = 4;
  const numStartX = startX + cols * (keyW + gapX) + 0.015;
  const numGeo = new THREE.BoxGeometry(keyW, keyH, keyD);
  
  for (let r = 1; r <= numRows; r++) {
    for (let c = 0; c < numCols; c++) {
      const numKey = new THREE.Mesh(numGeo, keyMat);
      const posX = numStartX + c * (keyW + gapX);
      const posZ = startZ + r * (keyD + gapZ);
      numKey.position.set(posX, keyH / 2, posZ);
      numKey.castShadow = true;
      keyAreaGroup.add(numKey);
    }
  }

  keyAreaGroup.position.y = 0.012;
  kbdGroup.add(keyAreaGroup);

  kbdGroup.rotation.x = -0.05;

  return kbdGroup;
}

function buildMouseMesh() {
  const mouseGroup = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f2124, roughness: 0.3, metalness: 0.3 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.6 });

  const mouseW = 0.065, mouseH = 0.032, mouseL = 0.11;

  const mainBodyGeo = new THREE.SphereGeometry(mouseL / 2, 16, 16);
  mainBodyGeo.scale(mouseW / mouseL, mouseH / (mouseL / 2), 1.0);
  
  const mainBody = new THREE.Mesh(mainBodyGeo, bodyMat);
  mainBody.position.y = mouseH / 2 - 0.003;
  mainBody.castShadow = true;
  mainBody.receiveShadow = true;
  mouseGroup.add(mainBody);

  const leftButtonGeo = new THREE.BoxGeometry(mouseW * 0.44, 0.005, mouseL * 0.38);
  const leftButton = new THREE.Mesh(leftButtonGeo, bodyMat);
  leftButton.position.set(-mouseW * 0.24, mouseH * 0.75, -mouseL * 0.22);
  leftButton.rotation.x = -0.12;
  leftButton.castShadow = true;
  mouseGroup.add(leftButton);

  const rightButton = new THREE.Mesh(leftButtonGeo, bodyMat);
  rightButton.position.set(mouseW * 0.24, mouseH * 0.75, -mouseL * 0.22);
  rightButton.rotation.x = -0.12;
  rightButton.castShadow = true;
  mouseGroup.add(rightButton);

  const gap = new THREE.Mesh(new THREE.BoxGeometry(0.003, 0.008, mouseL * 0.4), accentMat);
  gap.position.set(0, mouseH * 0.72, -mouseL * 0.2);
  mouseGroup.add(gap);

  const scrollWheelGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.005, 16);
  const scrollWheel = new THREE.Mesh(scrollWheelGeo, wheelMat);
  scrollWheel.rotation.z = Math.PI / 2;
  scrollWheel.position.set(0, mouseH * 0.82, -mouseL * 0.22);
  scrollWheel.castShadow = true;
  mouseGroup.add(scrollWheel);

  const palmGrip = new THREE.Mesh(new THREE.SphereGeometry(mouseW * 0.42, 12, 12), accentMat);
  palmGrip.scale.set(1.0, 0.3, 1.2);
  palmGrip.position.set(0, mouseH * 0.45, mouseL * 0.15);
  mouseGroup.add(palmGrip);

  return mouseGroup;
}
